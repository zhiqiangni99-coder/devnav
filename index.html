<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevNav · 开发者导航</title>
  <meta name="description" content="开发者一站式导航：AI 助手、AI 开发、AIGC、网络调试、三端开发、前端、运维安全、算法刷题，179+ 精选站点。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236c7bff'/%3E%3Ctext x='16' y='21' font-size='12' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'%3EDN%3C/text%3E%3C/svg%3E" />
  <meta property="og:title" content="DevNav · 开发者导航" />
  <meta property="og:description" content="开发者一站式导航：AI、AIGC、网络调试、三端开发、运维安全、算法刷题。" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="logo">D<span class="logo-dot">N</span></span>
      <div class="brand-text">
        <strong>DevNav</strong>
        <small>开发者导航</small>
      </div>
    </div>
    <div class="topbar-right">
      <span id="clock" class="clock" aria-label="当前时间"></span>
      <button id="btn-add" class="ghost-btn" title="添加自定义站点">＋ 收录</button>
      <button id="btn-data" class="ghost-btn" title="导入/导出我的数据">⇅ 数据</button>
      <button id="btn-theme" class="ghost-btn" title="切换深浅色">🌙</button>
    </div>
  </header>

  <section class="hero">
    <h1 id="greeting">晚上好，写点好代码</h1>
    <p class="hero-sub">为开发者精选的 179+ 站点 · 收藏与收录只存在你的浏览器</p>
    <div class="search-wrap">
      <div class="search-box">
        <select id="engine" title="选择搜索引擎"></select>
        <input id="search-input" type="text" placeholder="输入关键词搜索，或直接筛选下方站点（按 / 聚焦）" autocomplete="off" />
        <kbd>/</kbd>
      </div>
      <div id="suggestion" class="suggestion hidden"></div>
    </div>
  </section>

  <nav id="catnav" class="catnav" aria-label="分类快捷跳转"></nav>

  <main id="sections"></main>

  <footer class="footer">
    <p>DevNav · 极光玻璃主题 · 数据在 <code>data.js</code>，改内容不用动代码 · <span id="stat"></span></p>
  </footer>

  <!-- 添加站点弹窗 -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3>添加站点到「我的收录」</h3>
      <label>名称<input id="f-name" type="text" placeholder="例如：帧解析器" /></label>
      <label>网址<input id="f-url" type="url" placeholder="https://..." /></label>
      <label>描述<input id="f-desc" type="text" placeholder="一句话介绍（可选）" /></label>
      <div class="modal-actions">
        <button id="m-cancel" class="ghost-btn">取消</button>
        <button id="m-save" class="primary-btn">保存</button>
      </div>
    </div>
  </div>

  <!-- 数据导入导出弹窗 -->
  <div id="data-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3>我的数据（收藏 + 自定义收录）</h3>
      <p class="hint">导出为 JSON 备份，或粘贴之前的备份导入。</p>
      <textarea id="data-text" spellcheck="false"></textarea>
      <div class="modal-actions">
        <button id="d-import" class="primary-btn">导入</button>
        <button id="d-export" class="ghost-btn">复制到输入框</button>
        <button id="d-close" class="ghost-btn">关闭</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
